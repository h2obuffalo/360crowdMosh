[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crowd360"
version = "0.2.0"
description = "Motion-directed virtual camera for flat and stitched 360 crowd video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.9,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
live = ["pyvirtualcam>=0.14,<1"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools]
packages = ["crowd360"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["crowd360"]
ignore_missing_imports = true
check_untyped_defs = true
